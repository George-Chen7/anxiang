<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安响 · 社区告警与处置</title>
  <link rel="stylesheet" href="static-cloud.css">
</head>
<body class="auth-locked">
  <div class="app">
    <main>
      <div class="page-heading"><div><span class="eyebrow">安响 · 独居老人意外风险发现</span><h1>社区待核实事件</h1><p>澄湾社区 · 虚构演示数据 <span class="heading-separator">·</span> 关注疑似跌倒与异常静止，协助社区及时核实。</p></div><div class="summary"><span><b id="statBuildings">–</b> 栋住宅</span><span><b id="statUrgent">–</b> 条紧急</span><span><b id="statAlerts">–</b> 条告警</span><small id="todayLabel"></small></div></div>
      <div class="workspace" id="workspace">
        <section class="scene-panel" aria-label="可交互三维社区模型">
          <div class="panel-head"><div><span class="panel-kicker">SPACE VIEW / 01</span><h2>社区空间模型</h2><p>拖动旋转视角 · 滚轮缩放 · 点击楼栋与楼层</p></div><span class="live-badge"><i></i> 模型可交互</span></div>
          <div class="scene-wrap" id="sceneWrap"><div id="scene"></div><div class="scene-overlay top-left"><span class="tiny-square"></span> 澄湾社区 · 住宅区</div><div class="scene-hint" id="sceneHint">正在加载社区模型…</div><div class="floor-picker" id="floorPicker" hidden><div class="picker-head"><strong id="pickerTitle">楼层</strong><button id="closePicker" type="button" aria-label="关闭楼层选择">×</button></div><div id="floorGrid" class="floor-grid"></div></div><div class="scene-controls"><button id="rotationButton" type="button">Ⅱ 暂停旋转</button><button id="resetButton" type="button">↺ 复位视角</button></div></div>
          <div class="scene-footer"><span><i class="legend-dot red"></i> 紧急</span><span><i class="legend-dot amber"></i> 较高</span><span><i class="legend-dot gold"></i> 关注</span><span class="footer-note">告警点随楼栋三维位置移动</span></div>
        </section>
        <aside class="alert-panel" aria-label="告警信息"><div id="listView"><div class="aside-head"><span class="panel-kicker">ALERT CENTER / 02</span><h2>模拟告警 <em id="alertCount">–</em></h2><p>按告警等级和发生时间排列</p></div><div class="sync-row"><span class="sync-state loading" id="syncState">正在连接云端数据</span><div class="sync-actions"><button id="addEventButton" type="button" hidden>＋ 添加事件</button><button id="refreshButton" type="button">↻ 刷新</button></div></div><div class="load-error" id="loadError" hidden></div><div class="list-tools"><span>当前事件</span><span id="listCount">–</span></div><div id="alertList" class="alert-list"></div><div class="aside-foot">演示数据存于云端数据库，处置状态与记录刷新后仍会保留。</div></div><div id="detailView" hidden></div></aside>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="vendor/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="cloud-config.js"></script>
  <script src="static-auth.js"></script>
  <script src="static-cloud.js"></script>
</body>
</html>
